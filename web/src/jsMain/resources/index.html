<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Lauzhack Draw</title>
	<style>
		html, body, #root {
			height: 100%;
			margin: 0;
		}
		body {
			font-family: system-ui, sans-serif;
			background: #f4f4f5;
			color: #18181b;
		}
		.app {
			max-width: 640px;
			margin: 0 auto;
			padding: 32px 24px;
		}
		.app h1 {
			font-size: 24px;
			margin: 0 0 16px;
		}
		.toolbar {
			display: flex;
			gap: 8px;
			margin-bottom: 16px;
		}
		toolbar input, .app input, .app button {
			font: inherit;
			padding: 6px 12px;
			border-radius: 6px;
			border: 1px solid #d4d4d8;
		}
		.app button {
			cursor: pointer;
			background: #2563eb;
			color: #fff;
			border: 1px solid #2563eb;
		}
		.app button:hover {
			background: #1d4ed8;
		}
		.app ul {
			list-style: none;
			padding: 0;
			display: grid;
			gap: 4px;
		}
		.app li button {
			width: 100%;
			text-align: left;
			background: #fff;
			color: #18181b;
			border: 1px solid #e4e4e7;
		}
		.app li button:hover {
			background: #f4f4f5;
		}
		.hint {
			color: #71717a;
			font-size: 13px;
			margin-top: 24px;
		}
		.canvas-wrap {
			position: fixed;
			inset: 0;
		}
		.canvas-wrap .back {
			position: absolute;
			top: 10px;
			left: 10px;
			z-index: 1000;
		}
	</style>
</head>
<body>
	<div id="root"></div>
	<script src="app.js"></script>
</body>
</html>
