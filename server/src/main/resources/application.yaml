ktor:
  deployment:
    port: 8080
    host: 0.0.0.0
  application:
    modules:
      - com.lauzhack.server.ApplicationKt.module

ai:
  # OCR: light vision model on Together AI. Without TOGETHER_API_KEY chunks stay un-transcribed.
  togetherApiKey: "$TOGETHER_API_KEY:"
  ocrModel: "$OCR_MODEL:deepseek-ai/DeepSeek-V4.1-Flash-1017"
  # Hints for the circled "?": also on Together AI.
  hintModel: "$HINT_MODEL:deepseek-ai/DeepSeek-V4.1-Flash"
  # The page agent (actions list: hint / plot). No true "medium" tier is available
  # serverless on Together: Flash is the fast default, V4-Pro-0813 the heavy option.
  agentModel: "$AGENT_MODEL:deepseek-ai/DeepSeek-V4.1-Flash"
  # Thinking control (Together AI, DeepSeek V4.1 Flash is hybrid thinking-by-default):
  # - OCR: reasoning={"enabled": false} — the Together-specific toggle; reasoning_effort is NOT
  #   used because DeepSeek V4 accepts only high/max (low/medium/none get mapped to "high").
  #   Set ocrReasoningEnabled=true to have the OCR model think (slower, rarely needed).
  ocrReasoningEnabled: "$OCR_REASONING_ENABLED:false"
  # - Agent: reasoning stays ON (the tutor reasons); effort HIGH is the effective medium
  #   tier for DeepSeek V4 (Together maps medium→high, max is the heavy option).
  agentReasoningEffort: "$AGENT_REASONING_EFFORT:high"
